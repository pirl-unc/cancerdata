# Registry of every cohort-level expression source known to oncoref.
#
# Entries expose provenance through oncoref.expression_registry. Sources with a
# registry-backed builder can also be regenerated under
# ~/.cache/oncoref/expression/<id>/ and staged into the downloadable data bundle.
#
# Field reference:
#   id                 — stable identifier; matches the cache subdir.
#   category           — expression | (future) protein, etc.
#   cancer_codes       — oncoref cancer codes this source feeds.
#   source_type        — builder/loader contract, such as gdc, geo-matrix,
#                        recount3, sra-ncbi-counts, or treehouse-compendium.
#   builder            — build-time script that emits canonical source matrices.
#   external_build_exemption
#                      — nonempty reason a selected matrix cannot be rebuilt from
#                        public inputs. Mutually exclusive with builder.
#   routed_samples_may_overlap
#                      — true only when parent and child matrices intentionally
#                        reuse physical samples; otherwise routes are disjoint.
#   project_id         — GDC project, when source_type == gdc.
#   accession          — repository accession (GEO, BioProject, etc.).
#   url                — Direct download URL for single-file sources.
#   unit               — Native quantification unit at the source.
#   expected_size_gb   — Rough estimate of cached size after fetch.
#                        Used to summarize total disk usage. Treated
#                        as a hint, not a hard cap.
#   citation           — PMID / DOI / project URL for the source.
#   special_handling   — Inclusion/exclusion or interpretation quirks
#                        a re-runner needs to remember.

schema_version: 1

sources:
