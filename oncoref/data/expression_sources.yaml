      6 were selected from the thirteen-tumor study and sequenced as poly(A),
      paired-end bulk RNA-seq. Tumors 1-4, 6, and 9 were reported as primary;
      Tumors 5, 7, and 8 as recurrent; and the Tumor 2 biopsy came from a
      metastatic site. This mixed-origin n=9 cohort is a direct reference but
      remains reference-only rather than independently classification-ready.
      Direct per-tumor HPV evidence is preserved in the molecular-provenance
      manifest and is never inferred from diagnosis or expression.
