    builder: scripts/build_gdc_source.py
    expected_samples_by_code: {BL: 184}
    gdc_sample_types: [Primary Tumor]
    gdc_primary_diagnosis_contains: [Burkitt]
    unit: TPM
    library_prep: polyA RNA-seq   # CGCI Illumina TruSeq mRNA (polyA)
    expected_size_gb: 2
    citation: https://portal.gdc.cancer.gov/projects/CGCI-BLGSP
    source_version: GDC STAR - Counts, GENCODE v36; Ensembl IDs harmonized to Ensembl release 112; queried 2026-05-19
    processing_pipeline: gdc_star_counts_tpm_ensembl112_clean_tpm_16_9_75
    notes: >
      Open GDC CGCI-BLGSP STAR-counts TPMs; one deterministic primary
      Burkitt/Burkitt-like tumor sample per case; source matrix n=184 and
      released reference artifacts use 182 sample_expression_qc_v3 pass samples.
