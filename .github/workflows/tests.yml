name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  minimal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install core dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify minimal base-layer contract
        run: |
          python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("pyensembl") is None
          for dependency in ("matplotlib", "adjustText", "matplotlib_venn"):
              assert importlib.util.find_spec(dependency) is not None, dependency

          import oncoref

          assert oncoref.canonical_gene_id("TP53") == "ENSG00000141510"
          assert oncoref.canonical_gene_id("NOT_A_REAL_GENE") is None
          assert not oncoref.cancer_tmb_df().empty
          assert not oncoref.cancer_type_registry().empty

          try:
              oncoref.genomes()
          except ImportError as exc:
              assert "oncoref[genome]" in str(exc)
          else:
              raise AssertionError("genome API should require the optional extra")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check oncoref tests

      - name: Check formatting with ruff
        run: ruff format --check oncoref tests

  test:
    runs-on: ubuntu-latest
    env:
      # Keep pyensembl data under the workspace so actions/cache can archive it.
      PYENSEMBL_CACHE_DIR: ${{ github.workspace }}/.ci-cache/pyensembl
      # Keep real-data test fixtures under the workspace so actions/cache can archive them.
      CANCERDATA_SOURCE_MATRICES: ${{ github.workspace }}/.ci-cache/source-matrices
      CANCERDATA_DATA_DIR: ${{ github.workspace }}/.ci-cache/reference-data
      CANCERDATA_BUNDLED_DATA: ${{ github.workspace }}/.ci-cache/bundled-data
      # Pin the fixture by content, independently of an unreleased source-version bump.
      CI_LUAD_SOURCE_URL: https://github.com/pirl-unc/oncoref/releases/download/source-v5.22.8/LUAD_per_sample_tpm.parquet
      CI_LUAD_SHA256: 001ebb9ad18aea86599ff5d808851007523f6d8f0927dfdf2a2f39372f83ffc5
      CI_ACC_SOURCE_URL: https://github.com/pirl-unc/oncoref/releases/download/source-v5.22.8/ACC_per_sample_tpm.parquet
      CI_ACC_SHA256: c871d0255d4aea60b55069da4eddbcea3d45a7e7b21358e77b829368df5b54f5
      CI_ACC_REFERENCE_URL: https://github.com/pirl-unc/oncoref/releases/download/ci-fixtures-v1/ACC_reference_percentiles_v5.23.2.parquet
      CI_ACC_REFERENCE_SHA256: eab4da92aa12067f9f51d14532d3629d4a91732f9a3eb2fb03eb26f9f5fa4658
      ONCOREF_CI_ACC_PERCENTILE_REFERENCE: ${{ github.workspace }}/.ci-cache/reference-data/ci-fixtures/ACC_reference_percentiles_v5.23.2.parquet
      CI_HPA_RNA_SHA256: c49b5b33a076e3b9c1eb4f7d15d063ee936e07045e192ceccfeb9edcf1d90ddb
      CI_HPA_NORMAL_TISSUE_SHA256: 1fa9111070f23290d29a32eaa30695689599b5231e7d0bc935b60a777ad3a1cc
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache required source matrices
        uses: actions/cache@v5
        with:
          path: .ci-cache/source-matrices
          key: source-matrices-${{ env.CI_LUAD_SHA256 }}-${{ env.CI_ACC_SHA256 }}

      - name: Stage required source matrices
        run: |
          python - <<'PY'
          import hashlib
          import os
          import urllib.request

          from oncoref import source_matrices

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          for code in ("LUAD", "ACC"):
              path = source_matrices.local_path(code)
              expected_sha256 = os.environ[f"CI_{code}_SHA256"]
              if path.is_file() and sha256(path) != expected_sha256:
                  path.unlink()

              if not path.is_file():
                  temporary_path = path.with_suffix(".parquet.part")
                  urllib.request.urlretrieve(os.environ[f"CI_{code}_SOURCE_URL"], temporary_path)
                  observed_sha256 = sha256(temporary_path)
                  assert observed_sha256 == expected_sha256, (observed_sha256, expected_sha256)
                  temporary_path.replace(path)

              print(path)
          PY

      - name: Cache required reference data
        uses: actions/cache@v5
        with:
          path: .ci-cache/reference-data
          key: reference-data-${{ env.CI_ACC_REFERENCE_SHA256 }}-${{ env.CI_HPA_RNA_SHA256 }}-${{ env.CI_HPA_NORMAL_TISSUE_SHA256 }}

      - name: Stage required reference data
        run: |
          python - <<'PY'
          import hashlib
          import os
          import shutil
          import urllib.request
          from pathlib import Path

          from oncoref import data_bundle, reference_data

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          # Make the complete real-data dependency available before xdist starts.
          data_bundle.ensure_local(verbose=True)
          data_bundle.verify_local()

          acc_reference = Path(os.environ["ONCOREF_CI_ACC_PERCENTILE_REFERENCE"])
          expected_acc_sha256 = os.environ["CI_ACC_REFERENCE_SHA256"]
          if acc_reference.is_file() and sha256(acc_reference) != expected_acc_sha256:
              acc_reference.unlink()
          if not acc_reference.is_file():
              acc_reference.parent.mkdir(parents=True, exist_ok=True)
              temporary_path = acc_reference.with_suffix(".parquet.part")
              urllib.request.urlretrieve(os.environ["CI_ACC_REFERENCE_URL"], temporary_path)
              observed_sha256 = sha256(temporary_path)
              assert observed_sha256 == expected_acc_sha256, (
                  observed_sha256,
                  expected_acc_sha256,
              )
              temporary_path.replace(acc_reference)

          bundle_acc_reference = (
              data_bundle.cache_dir()
              / "cancer-reference-expression-percentiles"
              / "ACC.parquet"
          )
          if (
              not bundle_acc_reference.is_file()
              or sha256(bundle_acc_reference) != expected_acc_sha256
          ):
              bundle_acc_reference.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(acc_reference, bundle_acc_reference)

          hpa_sources = {
              "hpa_rna_consensus": os.environ["CI_HPA_RNA_SHA256"],
              "hpa_normal_tissue": os.environ["CI_HPA_NORMAL_TISSUE_SHA256"],
          }
          for name, expected_sha256 in hpa_sources.items():
              path = reference_data.local_path(name)
              if path.is_file() and sha256(path) != expected_sha256:
                  path.unlink()
              path = reference_data.download(name)
              observed_sha256 = sha256(path)
              assert observed_sha256 == expected_sha256, (observed_sha256, expected_sha256)
              print(path)
          PY

      - name: Cache Ensembl genome data
        uses: actions/cache@v5
        with:
          path: .ci-cache/pyensembl
          key: pyensembl-v2-human93

      - name: Install Ensembl release
        run: |
          pyensembl install \
            --release 93 \
            --species human \
            --custom-mirror https://github.com/openvax/ensembl-data/releases/download/GRCh38.93/

      - name: Verify Ensembl release
        run: |
          python - <<'PY'
          import oncoref

          releases = oncoref.genomes()
          assert any(genome.release == 93 for genome in releases), releases
          PY

      - name: Run unit tests
        run: >-
          pytest tests/ -v -n 2 --dist loadgroup
          --durations 20 --durations-min 0.5
          --cov=oncoref --cov-report=xml
