name: Tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  minimal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install core dependencies only
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Verify minimal base-layer contract
        run: |
          python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("pyensembl") is None

          import oncoref

          assert oncoref.canonical_gene_id("TP53") == "ENSG00000141510"
          assert oncoref.canonical_gene_id("NOT_A_REAL_GENE") is None
          assert not oncoref.cancer_tmb_df().empty
          assert not oncoref.cancer_type_registry().empty

          try:
              oncoref.genomes()
          except ImportError as exc:
              assert "oncoref[genome]" in str(exc)
          else:
              raise AssertionError("genome API should require the optional extra")
          PY

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check oncoref tests

      - name: Check formatting with ruff
        run: ruff format --check oncoref tests

  test:
    runs-on: ubuntu-latest
    env:
      # Keep pyensembl data under the workspace so actions/cache can archive it.
      PYENSEMBL_CACHE_DIR: ${{ github.workspace }}/.ci-cache/pyensembl
      # The real-cohort parity test requires the released LUAD source matrix.
      CANCERDATA_SOURCE_MATRICES: ${{ github.workspace }}/.ci-cache/source-matrices
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache required source matrices
        uses: actions/cache@v5
        with:
          path: .ci-cache/source-matrices
          key: source-matrices-v5.22.9-luad

      - name: Stage required source matrices
        run: |
          python - <<'PY'
          from oncoref import source_matrices

          path = source_matrices.ensure("LUAD")
          assert path.is_file(), path
          print(path)
          PY

      - name: Cache Ensembl genome data
        uses: actions/cache@v5
        with:
          path: .ci-cache/pyensembl
          key: pyensembl-v2-human93

      - name: Install Ensembl release
        run: |
          pyensembl install \
            --release 93 \
            --species human \
            --custom-mirror https://github.com/openvax/ensembl-data/releases/download/GRCh38.93/

      - name: Verify Ensembl release
        run: |
          python - <<'PY'
          import oncoref

          releases = oncoref.genomes()
          assert any(genome.release == 93 for genome in releases), releases
          PY

      - name: Run unit tests
        run: pytest tests/ -v --cov=oncoref --cov-report=xml
